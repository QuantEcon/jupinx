name: Test -> build lecture-python-programming
on:
  push:
    branches:
      - master
jobs:
  build-cache:
    name: Build leture-python-programming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup Anaconda
        uses: goanpeca/setup-miniconda@v1
        with:
          auto-update-conda: true
          auto-activate-base: true
          miniconda-version: 'latest'
          python-version: 3.7
          environment-file: environment.yml
          activate-environment: test-build
      - name: Install Jupinx
        run: python setup.py install
      - name: Checkout lecture-python-programming
        uses: actions/checkout@v2
        with:
          repository: QuantEcon/lecture-python-programming
          path: ./
      - name: Build Website
        shell: bash -l {0}
        run: |
          jupinx -w lecture-python-programming
          ls _build/website/jupyter_html/*